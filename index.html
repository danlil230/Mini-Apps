<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проектор BenQ — Кабинет информатики</title>
    <style>
        /* Анимированный переливающийся радужный фон */
        body {
            margin: 0;
            background: linear-gradient(120deg, #ff416c, #ff4b2b, #f7b733, #38ef7d, #11998e, #3a7bd5, #8e44ad);
            background-size: 400% 400%;
            animation: rainbowBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        @keyframes rainbowBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Общие экраны */
        .screen, .projector-glow, .cooling-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .screen {
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }

        /* Кнопка питания */
        .power-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a222d, #0d1218);
            border: 4px solid #2b394d;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(0,0,0,0.8);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.2s ease;
        }

        .power-btn:active {
            transform: scale(0.95);
        }

        .power-icon {
            width: 36px;
            height: 36px;
            border: 4px solid #00ffcc;
            border-radius: 50%;
            border-top-color: transparent;
            position: relative;
            display: flex;
            justify-content: center;
        }
        .power-icon::before {
            content: '';
            position: absolute;
            top: -7px;
            width: 4px;
            height: 15px;
            background-color: #00ffcc;
            border-radius: 2px;
        }

        .power-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 0 8px rgba(0,255,204,0.8);
            letter-spacing: 1px;
        }

        /* Экран прогрева / работы */
        .projector-glow {
            background: rgba(2, 5, 10, 0.96);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        /* Экран охлаждения */
        .cooling-screen {
            background: rgba(5, 10, 20, 0.97);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
        }

        .cooling-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #1a222d;
            border-top: 5px solid #ff4b2b;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Фирменный блок с нашей надписью «Бот Дани 2» */
        .benq-box {
            background: #0055ff;
            padding: 20px 45px;
            border-radius: 6px;
            box-shadow: 0 0 40px rgba(0, 120, 255, 0.8);
            transform: scale(0.7);
            opacity: 0;
            transition: all 1.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .benq-text {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sub-text {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #00ffcc;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .status-text {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
            text-align: center;
        }

        /* Меню игр */
        .menu-container {
            position: absolute;
            width: 85%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.75);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 1s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .menu-title {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.7);
        }

        .rainbow-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, filter 0.2s;
        }

        .rainbow-btn:active {
            transform: scale(0.97);
        }

        .btn-1 { background: linear-gradient(135deg, #ff416c, #ff4b2b); } 
        .btn-2 { background: linear-gradient(135deg, #f7b733, #fc4a1a); } 
        .btn-3 { background: linear-gradient(135deg, #11998e, #38ef7d); } 
        .btn-4 { background: linear-gradient(135deg, #cb2d3e, #ef473a); }

        /* Окно мини-игры «Хакерский кликер» */
        .modal-game {
            position: absolute;
            width: 90%;
            max-width: 420px;
            background: rgba(10, 15, 25, 0.95);
            border: 2px solid #00ffcc;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.4);
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .modal-game h2 {
            color: #00ffcc;
            margin-top: 0;
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }

        .clicker-score {
            font-size: 1.8rem;
            color: #fff;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .click-target-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #11998e, #38ef7d);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(56, 239, 125, 0.6);
            transition: transform 0.1s ease;
            margin: 15px 0;
        }

        .click-target-btn:active {
            transform: scale(0.92);
        }

        .close-game-btn {
            background: #ff4b2b;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div class="screen" id="startScreen">
        <div class="power-btn" onclick="startProjector()">
            <div class="power-icon"></div>
        </div>
        <div class="power-hint">НАЖМИТЕ ДЛЯ ВКЛЮЧЕНИЯ</div>
    </div>

    <!-- Экран прогрева -->
    <div class="projector-glow" id="projectorGlow">
        <div class="benq-box" id="benqBox">
            <span class="benq-text">BenQ</span>
            <span class="sub-text">Бот Дани 2</span>
        </div>
        <div class="status-text" id="statusText">Подача питания на блок розжига...</div>
    </div>

    <!-- Экран охлаждения -->
    <div class="cooling-screen" id="coolingScreen">
        <div class="cooling-spinner"></div>
        <div class="status-text" id="coolingStatus">Охлаждение лампы (Работа вентиляторов)...</div>
    </div>

    <!-- Меню игр -->
    <div class="menu-container" id="menuContainer">
        <div class="menu-title">🖥 БОТ ДАНИ 2: ИГРЫ</div>
        <button class="rainbow-btn btn-1" onclick="alert('Запуск: Взлом сервера!')">🔓 Взломай сервер (Код)</button>
        <button class="rainbow-btn btn-2" onclick="alert('Запуск: Битва с Багом!')">🐛 Битва с Синим Экраном</button>
        <button class="rainbow-btn btn-3" onclick="openClicker()">⚡ Хакерский кликер</button>
        <button class="rainbow-btn btn-4" onclick="turnOffProjector()">🔴 Выключить проектор</button>
    </div>

    <!-- Окно Хакерского кликера -->
    <div class="modal-game" id="clickerModal">
        <h2>⚡ ТЕРМИНАЛ КЛИКЕРА</h2>
        <div class="clicker-score" id="scoreText">Написано строк: 0</div>
        <button class="click-target-btn" onclick="addScore()">КОДИТЬ</button>
        <button class="close-game-btn" onclick="closeClicker()">Закрыть терминал</button>
    </div>

    <script>
        let codeLines = 0;

        function playBeep(frequency, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Аудио недоступно");
            }
        }

        function startProjector() {
            playBeep(450, 0.4);

            const startScreen = document.getElementById('startScreen');
            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 800);

            const glow = document.getElementById('projectorGlow');
            glow.style.opacity = '1';

            setTimeout(() => {
                document.getElementById('statusText').innerText = "Розжиг дуговой лампы...";
            }, 2000);

            setTimeout(() => {
                document.getElementById('statusText').innerText = "Прогрев лампы (120W)...";
            }, 4500);

            setTimeout(() => {
                playBeep(880, 0.8); 
                const logo = document.getElementById('benqBox');
                logo.style.opacity = '1';
                logo.style.transform = 'scale(1)';
                document.getElementById('statusText').innerText = "Проектор запущен. Синхронизация...";
            }, 7500);

            setTimeout(() => {
                glow.style.opacity = '0';
                glow.style.pointerEvents = 'none';
                
                const menu = document.getElementById('menuContainer');
                menu.style.opacity = '1';
                menu.style.pointerEvents = 'auto';
                menu.style.transform = 'translateY(0)';
            }, 10000);
        }

        function openClicker() {
            playBeep(700, 0.2);
            document.getElementById('clickerModal').style.display = 'flex';
        }

        function closeClicker() {
            playBeep(500, 0.2);
            document.getElementById('clickerModal').style.display = 'none';
        }

        function addScore() {
            codeLines++;
            document.getElementById('scoreText').innerText = "Написано строк: " + codeLines;
            playBeep(950, 0.05); // Короткий мягкий клик при нажатии
        }

        function turnOffProjector() {
            const menu = document.getElementById('menuContainer');
            menu.style.opacity = '0';
            menu.style.pointerEvents = 'none';

            const cooling = document.getElementById('coolingScreen');
            cooling.style.opacity = '1';
            playBeep(300, 0.5);

            setTimeout(() => {
                document.getElementById('coolingStatus').innerText = "Снижение температуры корпуса до нормы...";
            }, 2500);

            setTimeout(() => {
                document.getElementById('coolingStatus').innerText = "Охлаждение завершено. Лампа выключена.";
                playBeep(200, 0.8);
            }, 5500);

            setTimeout(() => {
                location.reload(); 
            }, 7000);
        }
    </script>
</body>
</html>
