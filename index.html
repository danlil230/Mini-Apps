<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projector Installer Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 { color: #38bdf8; font-size: 16px; margin: 0 0 3px 0; }
        p { font-size: 11px; margin: 0; color: #94a3b8; }

        /* Кнопка планшета */
        #tablet-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            font-family: inherit;
            z-index: 10;
        }

        /* Экран планшета */
        #tablet-overlay {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; max-width: 380px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 15px;
            padding: 20px;
            z-index: 20;
            color: #f8fafc;
            text-align: left;
        }
        #tablet-overlay h2 { color: #38bdf8; font-size: 18px; margin-top: 0; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .order-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .order-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #4ade80; }
        .order-card p { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; }
        .order-btn { background-color: #22c55e; color: #0f172a; border: none; padding: 8px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-family: inherit; }
        .close-tablet { background-color: #ef4444; color: #fff; margin-top: 10px; }
        .stats-bar { font-size: 13px; margin-bottom: 12px; background: #0f172a; padding: 8px 12px; border-radius: 6px; text-align: center; }

        /* Экран вождения / поездки */
        #driving-ui {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 15;
        }
        .drive-btn {
            background: rgba(56, 189, 248, 0.8);
            color: #0f172a;
            border: none;
            width: 70px; height: 70px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Экран монтажа */
        #installation-ui {
            display: none;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            text-align: center;
        }
        .install-action-btn {
            background-color: #22c55e;
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            font-family: inherit;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1 id="game-title">Симулятор Установщика</h1>
        <p id="game-subtitle">Откройте планшет и выберите заказ</p>
    </div>

    <!-- Главная кнопка планшета -->
    <button id="tablet-btn" onclick="toggleTablet()">📱 Планшет с заказами</button>

    <!-- Меню планшета -->
    <div id="tablet-overlay">
        <h2>Планшет мастера</h2>
        <div class="stats-bar">
            💰 Баланс: <b id="money" style="color: #4ade80;">0</b> руб.
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">Доступные заказы:</p>

        <div class="order-card">
            <h3>Офисный проектор BenQ</h3>
            <p>Доехать до офиса и смонтировать.<br>Награда: <b>+2000 руб.</b></p>
            <button class="order-btn" onclick="startMission(2000, 'Офисный BenQ')">Принять заказ</button>
        </div>

        <button class="order-btn close-tablet" onclick="toggleTablet()">Закрыть</button>
    </div>

    <!-- Управление машиной на телефоне -->
    <div id="driving-ui">
        <button class="drive-btn" ontouchstart="turnCar(-1)" onmousedown="turnCar(-1)">◀</button>
        <button class="drive-btn" ontouchstart="turnCar(1)" onmousedown="turnCar(1)">▶</button>
    </div>

    <!-- Кнопка монтажа на объекте -->
    <div id="installation-ui">
        <button class="install-action-btn" onclick="completeInstallation()">🛠 Прикрутить кронштейн и повесить проектор</button>
    </div>

    <script>
        let scene, camera, renderer;
        let gameState = 'MENU'; // MENU, DRIVING, INSTALLING
        let playerMoney = 0;
        let currentReward = 0;
        
        // Объекты сцены
        let car, projectorModel;
        let carSpeed = 0.1;
        let carDirection = 0;
        let roadSections = [];
        let distanceToTravel = 100;
        let distanceTraveled = 0;

        init3D();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);

            createCarScene();
            createInstallScene();

            showMenuScene();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', handleKeyDown);

            animate();
        }

        // --- СОЗДАНИЕ СЦЕН (МАШИНА И КОМНАТА) ---
        function createCarScene() {
            car = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.2, 0.6, 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            car.add(body);
            scene.add(car);

            // Дорога
            const roadGeo = new THREE.PlaneGeometry(8, 300);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            scene.add(road);
            road.name = "road";
        }

        function createInstallScene() {
            projectorModel = new THREE.Group();
            const pBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1.5), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
            const pLens = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.4, 32), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            pLens.rotation.x = Math.PI / 2;
            pLens.position.set(0.6, 0, 0.8);
            projectorModel.add(pBody, pLens);
            projectorModel.position.set(0, 0, -3);
            scene.add(projectorModel);
        }

        // --- УПРАВЛЕНИЕ ИГРОВЫМИ СОСТОЯНИЯМИ ---
        function toggleTablet() {
            if (gameState !== 'MENU') return;
            const overlay = document.getElementById('tablet-overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function startMission(reward, name) {
            currentReward = reward;
            toggleTablet();
            document.getElementById('tablet-btn').style.display = 'none';
            document.getElementById('driving-ui').style.display = 'flex';
            document.getElementById('game-title').innerText = `Едем на заказ: ${name}`;
            document.getElementById('game-subtitle').innerText = 'Управляйте машиной (стрелки или кнопки)';

            gameState = 'DRIVING';
            distanceTraveled = 0;
            car.position.set(0, 0, 0);
            car.visible = true;
            projectorModel.visible = false;
            scene.getObjectByName("road").visible = true;
            camera.position.set(0, 5, 8);
        }

        function arriveAtClient() {
            gameState = 'INSTALLING';
            document.getElementById('driving-ui').style.display = 'none';
            document.getElementById('installation-ui').style.display = 'block';
            document.getElementById('game-title').innerText = "Монтаж оборудования";
            document.getElementById('game-subtitle').innerText = "Установите проектор на кронштейн";

            car.visible = false;
            scene.getObjectByName("road").visible = false;
            projectorModel.visible = true;
            camera.position.set(0, 1, 4);
            camera.lookAt(projectorModel.position);
        }

        function completeInstallation() {
            playerMoney += currentReward;
            document.getElementById('money').innerText = playerMoney;
            document.getElementById('installation-ui').style.display = 'none';
            document.getElementById('tablet-btn').style.display = 'block';
            document.getElementById('game-title').innerText = "Симулятор Установщика";
            document.getElementById('game-subtitle').innerText = "Заказ выполнен! Откройте планшет для нового контракта.";

            gameState = 'MENU';
            showMenuScene();
        }

        function showMenuScene() {
            car.visible = false;
            scene.getObjectByName("road").visible = false;
            projectorModel.visible = true;
            projectorModel.rotation.set(0, 0, 0);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);
        }

        // Управление машиной
        function turnCar(dir) {
            if (gameState === 'DRIVING') {
                car.position.x += dir * 0.8;
                car.position.x = Math.max(-3, Math.min(3, car.position.x)); // Ограничение дороги
            }
        }

        function handleKeyDown(e) {
            if (gameState === 'DRIVING') {
                if (e.key === 'ArrowLeft' || e.key === 'a') turnCar(-1);
                if (e.key === 'ArrowRight' || e.key === 'd') turnCar(1);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Главный цикл анимации
        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'DRIVING') {
                car.position.z -= carSpeed * 5;
                camera.position.z = car.position.z + 8;
                distanceTraveled += carSpeed;

                if (distanceTraveled > 40) { // Конец пути до клиента
                    arriveAtClient();
                }
            } else if (gameState === 'MENU') {
                projectorModel.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
