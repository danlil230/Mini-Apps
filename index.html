<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Projector Installer Sim</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            color: #38bdf8;
            font-size: 16px;
            margin: 0 0 3px 0;
        }
        p {
            font-size: 11px;
            margin: 0;
            color: #94a3b8;
        }
        /* Кнопка планшета */
        #tablet-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            font-family: inherit;
            transition: 0.2s;
            z-index: 10;
        }
        #tablet-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
        /* Интерфейс планшета */
        #tablet-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 380px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 20;
            color: #f8fafc;
            text-align: left;
        }
        #tablet-overlay h2 {
            color: #38bdf8;
            font-size: 18px;
            margin-top: 0;
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .order-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .order-card h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #4ade80;
        }
        .order-card p {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .order-btn {
            background-color: #22c55e;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }
        .close-tablet {
            background-color: #ef4444;
            color: #fff;
            margin-top: 10px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 12px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>Симулятор Установщика</h1>
        <p>Вращайте сцену мышкой или пальцем</p>
    </div>

    <!-- Кнопка вызова планшета -->
    <button id="tablet-btn" onclick="toggleTablet()">📱 Планшет с заказами</button>

    <!-- Экран планшета -->
    <div id="tablet-overlay">
        <h2>Планшет мастера</h2>
        <div class="stats-bar">
            <span>💰 Баланс: <b id="money" style="color: #4ade80;">0</b> руб.</span>
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">Доступные заказы:</p>

        <div class="order-card">
            <h3>Офисный проектор BenQ</h3>
            <p>Установка в переговорной. Сложность: Легко.<br>Награда: <b>+1500 руб.</b></p>
            <button class="order-btn" onclick="acceptOrder(1500, 'Офисный BenQ')">Взять заказ</button>
        </div>

        <div class="order-card">
            <h3>Домашний кинотеатр 4K</h3>
            <p>Монтаж экрана и мощного проектора. Сложность: Средне.<br>Награда: <b>+4000 руб.</b></p>
            <button class="order-btn" onclick="acceptOrder(4000, 'Домашний 4K')">Взять заказ</button>
        </div>

        <button class="order-btn close-tablet" onclick="toggleTablet()">Закрыть планшет</button>
    </div>

    <script>
        // 1. 3D Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x38bdf8, 1.5, 50);
        pointLight.position.set(2, 5, 3);
        scene.add(pointLight);

        // Модель проектора на столе
        const projectorGroup = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 1.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        projectorGroup.add(body);

        const lensGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.4, 32);
        const lensMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 });
        const lens = new THREE.Mesh(lensGeo, lensMat);
        lens.rotation.x = Math.PI / 2;
        lens.position.set(0.6, 0, 0.8);
        projectorGroup.add(lens);

        scene.add(projectorGroup);

        // Пол
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1;
        scene.add(floor);

        // Управление вращением (Мышь + Тач для телефонов)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            projectorGroup.rotation.y += (e.clientX - previousMousePosition.x) * 0.01;
            projectorGroup.rotation.x += (e.clientY - previousMousePosition.y) * 0.01;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // Поддержка пальцев на смартфонах
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            projectorGroup.rotation.y += (e.touches[0].clientX - previousMousePosition.x) * 0.01;
            projectorGroup.rotation.x += (e.touches[0].clientY - previousMousePosition.y) * 0.01;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        // Логика планшета и экономики
        let playerMoney = 0;
        let tabletOpen = false;

        function toggleTablet() {
            tabletOpen = !tabletOpen;
            document.getElementById('tablet-overlay').style.display = tabletOpen ? 'block' : 'none';
        }

        function acceptOrder(reward, orderName) {
            playerMoney += reward;
            document.getElementById('money').innerText = playerMoney;
            alert(`Заказ "${orderName}" успешно выполнен! Получено ${reward} руб.`);
            toggleTablet();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging && !tabletOpen) {
                projectorGroup.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
